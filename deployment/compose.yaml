version: '3.8'
services:
  go-auth:
    image: ${SERVICE_NAME}:${IMG_VER}
    restart: always
    env_file:
      - .env
    ports:
      - "8080:8080"
    volumes:
      - ./deployment/application-local.yaml:/app/application.yaml
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
  redis:
    image: redis:7.2.3
    restart: always
    command: >
      --requirepass ${REDIS_PASSWORD}
    ports:
      - ${REDIS_PORT}:${REDIS_PORT}
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "-a",
          "${REDIS_PASSWORD}",
          "ping"
        ]
      interval: 5s
      timeout: 5s
      retries: 5
  db:
    image: postgres:17.5
    restart: always
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - ${POSTGRES_PORT}:${POSTGRES_PORT}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER}" ]
      interval: 5s
      timeout: 5s
      retries: 5
  db-migrate:
    image: migrate/migrate:v4.18.3
    container_name: migration-instance
    environment:
      - PGPASSWORD=${POSTGRES_PASSWORD}
      - PGUSER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ./migrations:/migrations:ro
    depends_on:
      db:
        condition: "service_healthy"
    command: ["-path", "/migrations", "-database", "postgres://db:${POSTGRES_PORT}/${POSTGRES_DB}?sslmode=disable", "-verbose", "goto", "2"]